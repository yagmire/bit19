<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BIT19</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-select"><rect x="4" y="4" width="16" height="16" stroke-dasharray="3 3"/></g>
    <g id="i-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></g>
    <g id="i-eraser"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></g>
    <g id="i-bucket"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></g>
    <g id="i-invert"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></g>
    <g id="i-trash"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></g>
    <g id="i-undo"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></g>
    <g id="i-redo"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></g>
    <g id="i-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></g>
    <g id="i-open"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></g>
    <g id="i-copy"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></g>
    <g id="i-code"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></g>
  </defs>
</svg>

<div class="app">
  <header class="menubar">
    <button id="openBtn" class="mb" title="Open project (.json)"><svg class="i" viewBox="0 0 24 24"><use href="#i-open"/></svg>Open</button>
    <button id="downloadBtn" class="mb" title="Save project (.json)"><svg class="i" viewBox="0 0 24 24"><use href="#i-download"/></svg>Save</button>
    <span class="sep"></span>
    <button id="undoBtn" class="mb" title="Undo (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><use href="#i-undo"/></svg>Undo</button>
    <button id="redoBtn" class="mb" title="Redo (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><use href="#i-redo"/></svg>Redo</button>
    <input id="jsonFile" type="file" accept=".json" hidden>
  </header>

  <div class="workspace">
    <aside class="toolbar">
      <button id="selectBtn" class="tool secondary" title="Select / move (M)"><svg class="i" viewBox="0 0 24 24"><use href="#i-select"/></svg></button>
      <button id="paintBtn" class="tool" title="Pencil (B)"><svg class="i" viewBox="0 0 24 24"><use href="#i-pencil"/></svg></button>
      <button id="eraseBtn" class="tool secondary" title="Eraser (E)"><svg class="i" viewBox="0 0 24 24"><use href="#i-eraser"/></svg></button>
      <button id="fillBtn" class="tool secondary" title="Fill (G)"><svg class="i" viewBox="0 0 24 24"><use href="#i-bucket"/></svg></button>
      <hr>
      <button id="invertBtn" class="tool secondary" title="Invert colors"><svg class="i" viewBox="0 0 24 24"><use href="#i-invert"/></svg></button>
      <button id="clearBtn" class="tool secondary" title="Clear canvas"><svg class="i" viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
    </aside>

    <main class="stage">
      <div class="preview" id="previewWrap">
        <canvas id="bitmapCanvas" width="234" height="234"></canvas>
      </div>
    </main>

    <aside class="side">
      <section class="card">
        <h3>Palette</h3>
        <div id="paletteEditor" class="palette"></div>
      </section>
      <section class="card">
        <h3>Canvas</h3>
        <div class="grid">
          <label>Rows <input id="rows" type="number" min="1" value="19"></label>
          <label>Cols <input id="cols" type="number" min="1" value="19"></label>
          <label>Zoom <input id="pxSize" type="number" min="4" max="64" value="18"></label>
        </div>
        <button id="resizeBtn" class="small">Resize</button>
      </section>
      <section class="card">
        <h3>Import</h3>
        <textarea id="loadArea" placeholder="Paste e.g. const bitmap = [...];"></textarea>
        <button id="loadBtn" class="small"><svg class="i" viewBox="0 0 24 24"><use href="#i-open"/></svg>Load array</button>
      </section>
      <section class="card">
        <h3>Export</h3>
        <textarea id="exportArea" readonly></textarea>
        <div class="row">
          <button id="exportBtn" class="small secondary"><svg class="i" viewBox="0 0 24 24"><use href="#i-code"/></svg>Export array</button>
          <button id="copyBtn" class="small secondary"><svg class="i" viewBox="0 0 24 24"><use href="#i-copy"/></svg><span class="lbl">Copy</span></button>
        </div>
      </section>
    </aside>
  </div>

  <footer class="statusbar">
    <span>Tool: <b id="statusTool">Paint</b></span>
    <span>Size: <b id="statusSize">19×19</b></span>
    <span>Cell: <b id="statusPos">–</b></span>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
